name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          echo "Checking repository structure..."
          for path in README.md LICENSE CONTRIBUTING.md .env.example docs assets/project.png; do
            test -e "$path" || { echo "✗ $path is missing"; exit 1; }
            echo "✓ $path"
          done
          echo ""
          echo "All checks passed!"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
